<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civic Radar - Pantau & Lapor Masalah Publik</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS (Untuk Peta) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- File CSS Lokal -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 font-sans antialiased overflow-hidden">

    <!-- 1. HEADER / NAVBAR -->
    <header class="bg-sky-50 border-b border-sky-200 px-6 py-3 flex justify-between items-center relative z-20 shadow-sm">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-sky-600 rounded-lg flex items-center justify-center text-white font-bold">CR</div>
            <h1 class="text-lg font-bold text-slate-800">Civic Radar</h1>
        </div>
        <div id="lokasi-teks" class="text-sm text-slate-600 hidden md:block">
            Mendeteksi lokasi Anda...
        </div>
        <div class="flex items-center gap-3">
            <span class="text-xs bg-sky-100 text-sky-700 px-3 py-1 rounded-full font-medium">Warga Aktif</span>
        </div>
    </header>

    <!-- 2. AREA UTAMA (PETA + OVERLAY UI) -->
    <main class="relative w-full h-[calc(100vh-57px)]">
        
        <!-- Panel Pencarian & Filter Mengambang (Kiri Atas) -->
        <div class="absolute top-4 left-4 z-10 w-80 md:w-96 flex flex-col gap-2">
            <div class="bg-white rounded-xl shadow-md p-2 flex items-center border border-slate-200">
                <input type="text" id="search-input" placeholder="Cari laporan di sekitar..." 
                       class="w-full px-3 py-1.5 text-sm outline-none text-slate-700">
            </div>
            
            <!-- Tombol Filter Status -->
            <div class="flex gap-2 overflow-x-auto pb-1">
                <button onclick="filterLaporan('semua')" class="filter-btn bg-sky-600 text-white text-xs px-3 py-1.5 rounded-lg shadow font-medium">Semua</button>
                <button onclick="filterLaporan('urgent')" class="filter-btn bg-white text-slate-700 hover:bg-slate-50 text-xs px-3 py-1.5 rounded-lg shadow font-medium">Urgent</button>
                <button onclick="filterLaporan('proses')" class="filter-btn bg-white text-slate-700 hover:bg-slate-50 text-xs px-3 py-1.5 rounded-lg shadow font-medium">Diproses</button>
                <button onclick="filterLaporan('selesai')" class="filter-btn bg-white text-slate-700 hover:bg-slate-50 text-xs px-3 py-1.5 rounded-lg shadow font-medium">Selesai</button>
            </div>
        </div>

        <!-- Wadah Peta Fullscreen -->
        <div id="map" class="w-full h-full z-0"></div>

        <!-- Tombol Mengambang "Buat Laporan Baru" (Kanan Bawah) -->
        <button onclick="bukaModal()" 
                class="absolute bottom-6 right-6 z-10 bg-sky-600 hover:bg-sky-700 text-white font-semibold px-5 py-3.5 rounded-full shadow-lg flex items-center gap-2 transition transform hover:scale-105">
            <span>Buat Laporan Baru</span>
            <span class="text-xl leading-none">+</span>
        </button>

    </main>

    <!-- 3. MODAL / POP-UP FORMULIR LAPORAN BARU -->
    <div id="modal-laporan" class="fixed inset-0 bg-black/50 z-30 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-slate-800">Buat Laporan Baru</h2>
                <button onclick="tutupModal()" class="text-slate-400 hover:text-slate-600 text-xl">&times;</button>
            </div>
            
            <form id="form-laporan" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Judul Masalah</label>
                    <input type="text" id="judul" required placeholder="Contoh: Jalan berlubang di tikungan" 
                           class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:border-sky-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Kategori / Tingkat Urgensi</label>
                    <select id="kategori" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                        <option value="urgent">Urgent (Membahayakan)</option>
                        <option value="proses">Fasilitas Umum / Sampah</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Deskripsi Singkat</label>
                    <textarea id="deskripsi" rows="3" required placeholder="Jelaskan detail kondisi di lapangan..." 
                              class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:border-sky-500 outline-none"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="tutupModal()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">Batal</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-sky-600 hover:bg-sky-700 text-white font-semibold rounded-lg">Kirim Laporan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- File JS Lokal -->
    <script src="app.js"></script>
</body>
</html>
